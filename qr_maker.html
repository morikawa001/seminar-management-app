
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>▌ SIBYL SYSTEM // QR ENCODER 管制 ▌</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- QRCode.js ライブラリ（日本語UTF-8対応の修正版をローカルに同梱） -->
  <script src="js/qrcode.js"></script>
<script src="js/matrix-rain.js"></script>
  <style>
    :root {
      --bg: #030509;
      --bg-panel: rgba(5, 10, 20, 0.96);
      --bg-panel-soft: rgba(8, 16, 30, 0.98);
      --border-soft: rgba(56, 182, 255, 0.28);
      --border-strong: rgba(92, 225, 255, 0.65);
      --text: #a9c8ff;
      --text-dim: #405f94;
      --text-faint: #1a3050;
      --accent: #38b6ff;
      --accent-strong: #9fdcff;
      --error: #ff5c7a;
      --shadow-soft: 0 0 22px rgba(56, 182, 255, 0.25);
      --radius: 18px;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--text);
      font-family: "Share Tech Mono", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(56,182,255,0.18), transparent 45%),
        radial-gradient(circle at bottom right, rgba(31,157,255,0.22), transparent 45%),
        linear-gradient(180deg, #010206 0%, #02050a 45%, #02040a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    #bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

    /* 縦スキャンライン（攻殻＋マトリックス風） */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(56,182,255,0.07) 0 1px,
          transparent 1px 4px
        ),
        linear-gradient(
          90deg,
          rgba(0,0,0,0.35),
          transparent 18%,
          transparent 82%,
          rgba(0,0,0,0.35)
        );
      mix-blend-mode: screen;
      opacity: 0.32;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
      border-radius: var(--radius);
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-soft), 0 24px 48px rgba(0,0,0,0.7);
      background:
        linear-gradient(145deg, rgba(2,5,12,0.96), rgba(6,12,24,0.98)),
        radial-gradient(circle at top right, rgba(56,182,255,0.08), transparent 55%);
      padding: var(--space-5) var(--space-5) var(--space-4);
      overflow: hidden;
    }

    .app::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(159,220,255,0.08), transparent 20%, transparent 80%, rgba(56,182,255,0.05)),
        repeating-linear-gradient(90deg, rgba(56,182,255,0.06) 0 1px, transparent 1px 3px);
      mix-blend-mode: color-dodge;
      opacity: 0.45;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .title-block {
      z-index: 1;
    }

    .title {
      margin: 0;
      font-family: "Orbitron", "Share Tech Mono", system-ui, sans-serif;
      font-size: 1rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-strong);
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .sb-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: sibyl-pulse 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes sibyl-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.75)} }

    .subtitle {
      margin: 4px 0 0;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .status-chip {
      z-index: 1;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(56,182,255,0.55);
      color: var(--accent);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: radial-gradient(circle, rgba(56,182,255,0.18), rgba(5,10,20,0.96));
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, 1fr);
      gap: var(--space-5);
      margin-top: var(--space-4);
      align-items: stretch;
    }

    @media (max-width: 780px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      position: relative;
      z-index: 1;
      border-radius: 16px;
      border: 1px solid var(--border-soft);
      background: linear-gradient(180deg, var(--bg-panel-soft), var(--bg-panel));
      padding: var(--space-4);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(56,182,255,0.12), transparent 18%, transparent 82%, rgba(31,157,255,0.08)),
        radial-gradient(circle at top left, rgba(56,182,255,0.18), transparent 55%);
      mix-blend-mode: screen;
      opacity: 0.55;
    }

    .panel-header {
      font-size: 0.78rem;
      color: var(--text-faint);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: var(--space-3);
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: rgba(2,5,12,0.98);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      box-shadow: inset 0 0 8px rgba(10,26,52,0.8);
    }

    input[type="text"]::placeholder {
      color: #1a3050;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0.7rem 0.95rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      background: radial-gradient(circle at top, #9fdcff, #38b6ff);
      color: #02101c;
      transition: transform 0.07s ease, box-shadow 0.07s ease, filter 0.07s ease;
      white-space: nowrap;
      box-shadow: 0 0 12px rgba(56,182,255,0.6);
    }

    button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 0 4px rgba(56,182,255,0.4);
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-top: 8px;
      margin-bottom: 4px;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .options-row > div {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    select {
      padding: 0.35rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: rgba(2,5,12,0.96);
      color: var(--text);
      font-size: 0.78rem;
      outline: none;
    }

    .radio-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
    }

    .radio-label input {
      width: auto;
      margin: 0;
      accent-color: #38b6ff;
    }

    .error {
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--error);
      min-height: 1.1em;
    }

    .qr-wrapper {
      margin-top: 4px;
      padding: 14px;
      border-radius: 14px;
      background: #ffffff;
      border: 6px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 0 18px rgba(0,0,0,0.7);
    }

    .qr-wrapper.transparent {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    #qrcode {
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #qrcode canvas,
#qrcode img {
  display: block;
  max-width: 100%;
  height: auto;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  -ms-interpolation-mode: nearest-neighbor;
}

    .hint {
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--text-faint);
      text-align: center;
    }

    .footer-row {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .footer-row button {
      flex: 1;
      min-width: 120px;
    }

    .footer-row button.secondary {
      background: radial-gradient(circle at top, #0a1a33, #050a13);
      color: var(--accent);
      box-shadow: 0 0 10px rgba(31,157,255,0.7);
    }

    .footer-row button.secondary:hover {
      filter: brightness(1.1);
    }

    @media (max-width: 600px) {
      .app {
        padding: var(--space-4);
      }
      .row {
        grid-template-columns: 1fr;
      }
      #qrcode {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="app">
    <div class="header">
      <div class="title-block">
        <h1 class="title"><span class="sb-dot"></span>▌ SIBYL SYSTEM // QR ENCODER 管制 ▌</h1>
        <p class="subtitle">PUBLIC SAFETY BUREAU · 公安局 — URL や文字データを高可読QRコードに変換します。</p>
      </div>
      <div class="status-chip">ONLINE · READY</div>
    </div>

    <div class="grid">
      <!-- 左：入力・オプション -->
      <section class="panel">
        <div class="panel-header">INPUT / PARAMETERS</div>
        <label for="urlInput">TARGET URL / TEXT</label>
        <div class="row">
          <input
            type="text"
            id="urlInput"
            placeholder="例: https://example.com ／ 管理棟４階 書庫A-1"
            autocomplete="off"
          />
          <button id="generateBtn">GENERATE</button>
        </div>

        <div class="options-row">
          <div>
            粗さ:
            <select id="densitySelect">
              <option value="fine">細かい</option>
              <option value="normal" selected>標準</option>
              <option value="rough">粗い</option>
              <option value="very-rough">超粗い</option>
            </select>
          </div>
          <div>
            背景:
            <label class="radio-label">
              <input type="radio" name="bgMode" value="solid" checked />
              白
            </label>
            <label class="radio-label">
              <input type="radio" name="bgMode" value="transparent" />
              透明
            </label>
          </div>
        </div>

        <div class="error" id="errorMsg"></div>

        <div class="footer-row">
          <button class="secondary" id="clearBtn">CLEAR</button>
          <button id="downloadBtn">DOWNLOAD PNG</button>
        </div>
      </section>

      <!-- 右：QR表示 -->
      <section class="panel">
        <div class="panel-header">OUTPUT / QR SYMBOL</div>
        <div class="qr-wrapper" id="qrWrapper">
          <div id="qrcode"></div>
          <div class="hint">
            生成後、カメラ／スキャナで読み込みテストしてください。<br>
            読みにくい場合は「粗さ」を変更して再生成します。
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    let qrcodeInstance = null;

    function getDensitySize() {
      const mode = document.getElementById("densitySelect").value;
      if (mode === "fine") return 320;
      if (mode === "normal") return 240;
      if (mode === "rough") return 160;
      if (mode === "very-rough") return 120;
      return 240;
    }

    function getBackgroundMode() {
      const radios = document.querySelectorAll('input[name="bgMode"]');
      for (const r of radios) {
        if (r.checked) return r.value;
      }
      return "solid";
    }

    function generateQR() {
      const input = document.getElementById("urlInput");
      const errorMsg = document.getElementById("errorMsg");
      const wrapper = document.getElementById("qrWrapper");
      const value = input.value.trim();

      errorMsg.textContent = "";

      if (!value) {
        errorMsg.textContent = "URLまたは文字データを入力してください。";
        return;
      }

      const container = document.getElementById("qrcode");
      container.innerHTML = "";

      if (qrcodeInstance) {
        qrcodeInstance.clear();
      }

      const size = getDensitySize();
      const bgMode = getBackgroundMode();
      const colorLight = bgMode === "transparent" ? "transparent" : "#ffffff";

      if (bgMode === "transparent") {
        wrapper.classList.add("transparent");
      } else {
        wrapper.classList.remove("transparent");
      }

      const levels = [QRCode.CorrectLevel.M, QRCode.CorrectLevel.L];
      let lastErr = null;
      for (const level of levels) {
        container.innerHTML = "";
        try {
          qrcodeInstance = new QRCode(container, {
            text: value,
            width: size,
            height: size,
            colorDark: "#000000",
            colorLight: colorLight,
            correctLevel: level
          });
          return;
        } catch (e) {
          lastErr = e;
        }
      }
      errorMsg.textContent =
        "QRコードを生成できませんでした。入力文字列が長すぎます（QRコードの容量上限を超えています）。文字数を減らして再実行してください。" +
        (lastErr && lastErr.message ? "（" + lastErr.message + "）" : "");
    }

        function clearAll() {
      const container = document.getElementById("qrcode");
      const input = document.getElementById("urlInput");
      const errorMsg = document.getElementById("errorMsg");
      const wrapper = document.getElementById("qrWrapper");

      input.value = "";
      errorMsg.textContent = "";
      container.innerHTML = "";
      wrapper.classList.remove("transparent");
      qrcodeInstance = null;
    }

    function downloadQR() {
      const container = document.getElementById("qrcode");
      let img = container.querySelector("img");
      let canvas = container.querySelector("canvas");

      if (!img && !canvas) {
        document.getElementById("errorMsg").textContent =
          "先にQRコードを生成してください。";
        return;
      }

      let dataUrl = "";
      if (canvas) {
        dataUrl = canvas.toDataURL("image/png");
      } else if (img) {
        dataUrl = img.src;
      }

      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = "qrcode.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    document.getElementById("generateBtn").addEventListener("click", generateQR);
    document.getElementById("clearBtn").addEventListener("click", clearAll);
    document.getElementById("downloadBtn").addEventListener("click", downloadQR);

    document.getElementById("urlInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        generateQR();
      }
    });

    
  </script>
</body>
</html>
