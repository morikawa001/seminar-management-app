

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臨床研究研修会 管理システム</title>
<link rel="stylesheet" href="css/theme-base.css">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<script src="js/theme-toggle.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surface:#f9f8f5;--surface2:#fbfbf9;--offset:#f3f0ec;--dynamic:#e6e4df;
  --divider:#dcd9d5;--border:#d4d1ca;
  --text:#28251d;--muted:#7a7974;--faint:#bab9b4;
  --primary:#01696f;--primary-h:#0c4e54;--primary-hi:#cedcd8;
  --success:#437a22;--success-hi:#d4dfcc;
  --warn:#964219;--warn-hi:#ddcfc6;
  --error:#a12c7b;--error-hi:#e0ced7;
  --gold:#d19900;--gold-hi:#e9e0c6;
  --blue:#006494;--blue-hi:#c6d8e4;
  --r-sm:.375rem;--r-md:.5rem;--r-lg:.75rem;--r-xl:1rem;--r-full:9999px;
  --sh-sm:0 1px 2px oklch(0.2 0.01 80/.06);
  --sh-md:0 4px 12px oklch(0.2 0.01 80/.08);
  --sh-lg:0 12px 32px oklch(0.2 0.01 80/.12);
  --tr:180ms cubic-bezier(0.16,1,0.3,1);
  --xs:clamp(.75rem,.7rem + .25vw,.875rem);
  --sm:clamp(.875rem,.8rem + .35vw,1rem);
  --base:clamp(1rem,.95rem + .25vw,1.125rem);
  --lg:clamp(1.125rem,1rem + .75vw,1.5rem);
}
[data-theme="dark"]{
  --bg:#171614;--surface:#1c1b19;--surface2:#201f1d;--offset:#1d1c1a;--dynamic:#2d2c2a;
  --divider:#262523;--border:#393836;
  --text:#cdccca;--muted:#797876;--faint:#5a5957;
  --primary:#4f98a3;--primary-h:#227f8b;--primary-hi:#313b3b;
  --success:#6daa45;--success-hi:#3a4435;
  --warn:#bb653b;--warn-hi:#564942;
  --error:#d163a7;--error-hi:#4c3d46;
  --gold:#e8af34;--gold-hi:#4d4332;
  --blue:#5591c7;--blue-hi:#3a4550;
  --sh-sm:0 1px 2px oklch(0 0 0/.2);
  --sh-md:0 4px 12px oklch(0 0 0/.3);
  --sh-lg:0 12px 32px oklch(0 0 0/.4);
}
html{-webkit-font-smoothing:antialiased}
body{min-height:100dvh;font-family:'Satoshi',sans-serif;font-size:var(--sm);color:var(--text);background:var(--bg);transition:background var(--tr),color var(--tr)}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
input,select{font:inherit;color:inherit}

header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--sh-sm)}
.hi{max-width:1400px;margin:0 auto;padding:0 1.5rem;height:56px;display:flex;align-items:center;gap:1rem}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:var(--base);color:var(--primary)}
.hact{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.btn{display:inline-flex;align-items:center;gap:.375rem;padding:.4rem .875rem;border-radius:var(--r-md);font-size:var(--xs);font-weight:500;transition:background var(--tr),color var(--tr),border-color var(--tr);white-space:nowrap;border:1px solid transparent}
.btn-p{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-p:hover{background:var(--primary-h)}
.btn-g{color:var(--muted);border-color:var(--border)}
.btn-g:hover{background:var(--offset);color:var(--text)}
.ibt{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-md);color:var(--muted);transition:background var(--tr),color var(--tr)}
.ibt:hover{background:var(--offset);color:var(--text)}

.tabs{background:var(--surface);border-bottom:1px solid var(--border)}
.tabs-in{max-width:1400px;margin:0 auto;padding:0 1.5rem;display:flex}
.tab{padding:.625rem 1rem;font-size:var(--xs);font-weight:500;color:var(--muted);border-bottom:2px solid transparent;transition:color var(--tr),border-color var(--tr);cursor:pointer}
.tab:hover{color:var(--text)}
.tab.act{color:var(--primary);border-bottom-color:var(--primary)}

.main{max-width:1400px;margin:0 auto;padding:1.5rem}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem;margin-bottom:1.5rem}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1rem;box-shadow:var(--sh-sm)}
.sl{font-size:var(--xs);color:var(--muted);margin-bottom:.25rem}
.sv{font-size:var(--lg);font-weight:700;font-variant-numeric:tabular-nums}
.sv.tc{color:var(--primary)}.sv.gc{color:var(--success)}.sv.oc{color:var(--gold)}.sv.bc{color:var(--blue)}

.fb{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.fi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:.4rem .75rem;font-size:var(--xs);outline:none;width:220px;transition:border-color var(--tr)}
.fi:focus{border-color:var(--primary)}
.fs{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:.4rem .625rem;font-size:var(--xs);outline:none;cursor:pointer}

.tw{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm)}
.ts{overflow-x:auto}
.dt{min-width:860px}
.dt thead th{background:var(--offset);padding:.5rem .75rem;font-size:var(--xs);font-weight:600;color:var(--muted);text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.dt thead th:hover{color:var(--text)}
.dt thead th.srt{color:var(--primary)}
.dt tbody tr{border-bottom:1px solid var(--divider);cursor:pointer;transition:background var(--tr)}
.dt tbody tr:hover{background:var(--offset)}
.dt tbody tr:last-child{border-bottom:none}
.dt tbody td{padding:.5rem .75rem;font-size:var(--xs);vertical-align:middle}
.tc2{font-weight:500;max-width:260px}
.tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.badge{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:var(--r-full);font-size:.68rem;font-weight:600;white-space:nowrap}
.bd{background:var(--success-hi);color:var(--success)}
.bw{background:var(--gold-hi);color:var(--gold)}
.bt{background:var(--dynamic);color:var(--muted)}
.bb{background:var(--blue-hi);color:var(--blue)}
.bo{background:var(--warn-hi);color:var(--warn)}

.pw{display:flex;align-items:center;gap:.375rem;min-width:80px}
.pb{flex:1;height:4px;background:var(--dynamic);border-radius:var(--r-full);overflow:hidden}
.pf{height:100%;border-radius:var(--r-full);transition:width .4s;background:var(--primary)}
.pf.full{background:var(--success)}
.pp{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;width:28px;text-align:right}

.dots{display:flex;flex-wrap:wrap;gap:2px;max-width:110px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.on{background:var(--success)}
.dot.off{background:var(--dynamic)}

.dtg{display:inline-flex;align-items:center;gap:.25rem;padding:.1rem .45rem;background:var(--offset);border-radius:var(--r-full);font-size:.67rem;color:var(--muted)}

/* Panel */
.ov{position:fixed;inset:0;background:oklch(0.15 0.01 80/.5);z-index:200;display:none;align-items:flex-start;justify-content:flex-end}
.ov.open{display:flex}
.pn{width:min(540px,100vw);height:100dvh;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;box-shadow:var(--sh-lg);animation:sli .2s ease}
@keyframes sli{from{transform:translateX(100%)}to{transform:translateX(0)}}
.ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.25rem;display:flex;align-items:center;gap:.75rem;z-index:1}
.ph h2{font-size:var(--base);font-weight:600;flex:1}
.pb2{padding:1.25rem}
.ps{margin-bottom:1.5rem}
.ps h3{font-size:var(--xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.625rem;padding-bottom:.375rem;border-bottom:1px solid var(--divider)}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.ii label{font-size:var(--xs);color:var(--muted);display:block;margin-bottom:.125rem}

.cl{display:grid;gap:.2rem}

.ci:hover{background:var(--offset)}

.ci label{font-size:var(--xs);cursor:pointer;flex:1;line-height:1.4}
.ci.ck label{color:var(--muted);text-decoration:line-through}

/* Gantt */
.gw{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm)}
.gc2{padding:.75rem 1rem;display:flex;gap:.5rem;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap}
.gsc{overflow-x:auto}
.gg{min-width:780px}
.ghd{display:flex;background:var(--offset);border-bottom:1px solid var(--border)}
.glc{width:200px;flex-shrink:0;padding:.5rem .75rem;font-size:var(--xs);font-weight:600;color:var(--muted)}
.gms{flex:1;display:flex}
.gm{flex:1;padding:.5rem .25rem;font-size:.65rem;font-weight:600;color:var(--muted);text-align:center;border-left:1px solid var(--divider)}
.gr{display:flex;align-items:center;border-bottom:1px solid var(--divider);min-height:38px;transition:background var(--tr)}
.gr:hover{background:var(--offset)}
.gr:last-child{border-bottom:none}
.grl{width:200px;flex-shrink:0;padding:.35rem .75rem;font-size:var(--xs)}
.grn{color:var(--muted);margin-right:.2rem}
.grt{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.gtl{flex:1;position:relative;height:38px}
.gbg{position:absolute;inset:0;display:flex;pointer-events:none}
.gbgm{flex:1;border-left:1px solid var(--divider)}
.gbgm:nth-child(even){background:oklch(from var(--offset) l c h/.5)}
.gbar{position:absolute;top:7px;bottom:7px;border-radius:var(--r-sm);cursor:pointer;transition:opacity var(--tr);z-index:1;min-width:8px}
.gbar:hover{opacity:.8;z-index:2}
.gbar.k1{background:var(--blue)}
.gbar.hp{background:var(--gold)}
.gbar.k2{background:var(--primary)}
.gbar.k3{background:var(--success)}
.gbar.ev{background:var(--error)}
.gbar.dn{opacity:.3}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--error);opacity:.7;pointer-events:none;z-index:5}
.gtoday::after{content:'今日';position:absolute;top:2px;left:3px;font-size:.58rem;color:var(--error);white-space:nowrap;font-weight:700}
.gleg{display:flex;gap:.75rem;flex-wrap:wrap;padding:.625rem 1rem;border-top:1px solid var(--divider)}
.gli{display:flex;align-items:center;gap:.3rem;font-size:.68rem;color:var(--muted)}
.gld{width:10px;height:10px;border-radius:2px}
.gtt{position:fixed;background:var(--text);color:var(--bg);padding:.35rem .6rem;border-radius:var(--r-md);font-size:.68rem;pointer-events:none;z-index:300;white-space:nowrap;box-shadow:var(--sh-md);display:none}

/* Upload */
.ua{border:2px dashed var(--border);border-radius:var(--r-xl);padding:3rem 2rem;text-align:center;cursor:pointer;transition:border-color var(--tr),background var(--tr);margin-bottom:1.5rem}
.ua:hover,.ua.drag{border-color:var(--primary);background:var(--primary-hi)}
.ui{margin:0 auto .75rem;width:48px;height:48px;color:var(--faint)}
.ut{font-size:var(--base);font-weight:500;margin-bottom:.25rem}
.us{font-size:var(--xs);color:var(--muted)}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--text);color:var(--bg);padding:.625rem 1rem;border-radius:var(--r-lg);font-size:var(--xs);box-shadow:var(--sh-lg);z-index:400;animation:tin .2s ease;pointer-events:none}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){
  .main{padding:1rem}
  .stats{grid-template-columns:repeat(2,1fr)}
  .fi{width:100%}
  .grl,.glc{width:140px}
}
</style>
</head>

<script>
// ===================== CSV PARSER =====================
function parseCSV(raw) {
  // 改行を含むセル（ダブルクォート内）を正しく処理
  const rows = [];
  let cur = '', inQ = false, cells = [];
  for (let i = 0; i < raw.length; i++) {
    const c = raw[i];
    if (c === '"') {
      if (inQ && raw[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) {
      cells.push(cur); cur = '';
    } else if ((c === '\n' || c === '\r') && !inQ) {
      if (c === '\r' && raw[i+1] === '\n') i++;
      cells.push(cur); cur = '';
      if (cells.some(x => x !== '')) rows.push(cells);
      cells = [];
    } else {
      cur += c;
    }
  }
  if (cur || cells.length) { cells.push(cur); if (cells.some(x=>x!=='')) rows.push(cells); }
  return rows;
}

function csvToObjects(raw) {
  const rows = parseCSV(raw);
  if (rows.length < 2) return [];
  // ヘッダー行（改行含む場合は空白で結合して正規化）
  const headers = rows[0].map(h => h.replace(/[\r\n]+/g,' ').trim());
  return rows.slice(1).map(r => {
    const o = {};
    headers.forEach((h, i) => o[h] = (r[i] || '').trim());
    return o;
  }).filter(o => o['起案行No'] && o['起案行No'] !== '');
}

function rowToSeminar(r) {
  return {
    no:    r['起案行No'] || '',
    year:  r['年度_YEAR_1'] || '',
    date:  r['開催日_DATE_1'] || '',
    day:   r['曜日 _DAY'] || '',
    start: r['研修会開始_START_1'] || '',
    end:   r['研修会終了_END_1'] || '',
    title: r['テーマ(標題)_TITLE'] || '',
    speaker: r['担当講師_SPEAKER'] || '',
    cohost:  r['共催_COHOST_1'] || '',
    subject: r['対象_SUBJECT_1'] || '',
    kian1:   r['起案1開催DATE_KIAN_1'] || '',
    hp:      r['HP案内開始チラシ配布'] || '',
    kian2:   r['起案2資料_DATE_KIAN_2'] || '',
    kian3:   r['起案3受講証修了証_DATE_KIAN_3'] || '',
    site:    r['講演場所_SITE'] || '',
    zoom_id: r['Zoom_ID_WEBINER_ID'] || '',
    zoom_pw: r['Zoom_パスコード_PASSCODE'] || '',
    hp_url:  r['HP_URL_url_1'] || '',
    status_k1: r['STATUS_K1'] || '',
    status_hp: r['STATUS_HP'] || '',
    status_k2: r['STATUS_K2'] || '',
    status_k3: r['STATUS_K3'] || '',
    // チェック項目
    c_create:    r['研修会演題と目的案を作成_CHECK'] || '0',

function isChecked(v) { return v === '1' || v === 1 || v === true; }
function getProgress(s) {
  const vals = CHECKS.map(c => isChecked(s[c.k]) ? 1 : 0);
  return Math.round(vals.reduce((a,b)=>a+b,0) / vals.length * 100);
}
function getStatus(s) {
  const p = getProgress(s);
  return p === 100 ? 'done' : p === 0 ? 'todo' : 'wip';
}

// ===================== RENDER STATS =====================
function renderStats() {
  const n = seminars.length;
  const done = seminars.filter(s=>getStatus(s)==='done').length;
  const wip = seminars.filter(s=>getStatus(s)==='wip').length;
  const todo = n - done - wip;
  const avgP = n ? Math.round(seminars.reduce((a,s)=>a+getProgress(s),0)/n) : 0;

function buildMonthFilter() {
  const seen = new Set();
  seminars.forEach(s => {

    if (m) seen.add(m[0]);
  });
  const sel = document.getElementById('fmon');
  sel.innerHTML = '<option value="">全月</option>';
  [...seen].sort((a,b)=>parseInt(a)-parseInt(b)).forEach(m=>{

  });
}

// ===================== RENDER TABLE =====================
function getFiltered() {
  const q = document.getElementById('srch').value.toLowerCase();
  const subj = document.getElementById('fsubj').value;
  const stat = document.getElementById('fstat').value;
  const mon = document.getElementById('fmon').value;
  return seminars.filter(s => {
    if (q && !s.title.toLowerCase().includes(q) && !s.speaker.toLowerCase().includes(q)) return false;
    if (subj && s.subject !== subj) return false;
    if (stat) {
      const st = getStatus(s);
      if (stat !== st) return false;
    }
    if (mon && !s.date.startsWith(mon)) return false;
    return true;
  }).sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (sortCol === 'no') { av = +av; bv = +bv; }
    return av > bv ? sortDir : av < bv ? -sortDir : 0;
  });
}

  const rows = getFiltered();

// ===================== GANTT =====================
const MONTHS = [
  {l:'4月',y:2026,m:4},{l:'5月',y:2026,m:5},{l:'6月',y:2026,m:6},
  {l:'7月',y:2026,m:7},{l:'8月',y:2026,m:8},{l:'9月',y:2026,m:9},
  {l:'10月',y:2026,m:10},{l:'11月',y:2026,m:11},{l:'12月',y:2026,m:12},
  {l:'1月',y:2027,m:1},{l:'2月',y:2027,m:2},{l:'3月',y:2027,m:3},
];

function parseJpDate(str) {
  if (!str) return null;
  const m = str.match(/(\d+)月(\d+)日/);
  if (!m) return null;
  const mo = +m[1], d = +m[2];
  const y = mo <= 3 ? 2027 : 2026;
  return new Date(y, mo-1, d);
}

function renderGantt() {
  const gfy = document.getElementById('gfy').value;
  const gfs = document.getElementById('gfs').value;
  let rows = seminars.filter(s => {
    if (gfs && s.subject !== gfs) return false;
    if (gfy !== 'all') {
      const d = parseJpDate(s.date);
      if (d && d.getFullYear() !== +gfy) return false;
    }
    return true;
  });

  const start = new Date(2026, 3, 1);
  const end = new Date(2027, 2, 31);
  const total = (end - start) / 86400000;

  function pct(d) {
    if (!d) return null;
    const days = (d - start) / 86400000;
    return Math.max(0, Math.min(100, days / total * 100));
  }

  const today = new Date();
  const todayP = pct(today);
  const todayLine = todayP >= 0 && todayP <= 100
    ? `<div class="gtoday" style="left:${todayP}%"></div>` : '';

  const monthHdr = MONTHS.map(m => `<div class="gm">${m.l}</div>`).join('');
  const bgMonths = MONTHS.map(() => `<div class="gbgm"></div>`).join('');

  const BARS = [
    {key:'kian1',cls:'k1',lbl:'起案1',stKey:'status_k1'},
    {key:'hp',   cls:'hp',lbl:'HP案内',stKey:'status_hp'},
    {key:'kian2',cls:'k2',lbl:'起案2',stKey:'status_k2'},
    {key:'kian3',cls:'k3',lbl:'起案3',stKey:'status_k3'},
    {key:'date', cls:'ev',lbl:'当日', stKey:'_ev'},
  ];

  const ganttRows = rows.map(s => {
    const bars = BARS.map(b => {
      const d = parseJpDate(b.key === 'date' ? s.date : s[b.key]);
      if (!d) return '';
      const p = pct(d);
      if (p === null) return '';
      const done = b.stKey === '_ev'
        ? isChecked(s.c_event)
        : (s[b.stKey] === 'DONE' || s[b.stKey] === 'done');
      return `<div class="gbar ${b.cls} ${done?'dn':''}"
        style="left:calc(${p}% - 5px);width:10px"
        data-tip="${b.lbl}: ${b.key==='date'?s.date:s[b.key]||'—'}"
        onmouseenter="showTip(event,this)" onmouseleave="hideTip()"></div>`;
    }).join('');
    return `<div class="gr">
      <div class="grl"><span class="grn">${s.no}.</span><span class="grt">${s.title}</span></div>
      <div class="gtl">
        <div class="gbg">${bgMonths}</div>
        ${todayLine}
        ${bars}
      </div>
    </div>`;
  }).join('') || `<div style="padding:2rem;text-align:center;color:var(--muted)">表示するデータがありません</div>`;

  document.getElementById('ganttGrid').innerHTML = `
    <div class="ghd"><div class="glc">研修会</div><div class="gms">${monthHdr}</div></div>
    ${ganttRows}
  `;
}

function showTip(e, el) {
  const t = document.getElementById('gtt');
  t.textContent = el.dataset.tip;
  t.style.display = 'block';
  t.style.left = (e.clientX + 12) + 'px';
  t.style.top = (e.clientY - 8) + 'px';
}
function hideTip() { document.getElementById('gtt').style.display = 'none'; }
document.addEventListener('mousemove', e => {
  const t = document.getElementById('gtt');
  if (t.style.display !== 'none') {
    t.style.left = (e.clientX + 12) + 'px';
    t.style.top = (e.clientY - 8) + 'px';
  }
});

// ===================== FILE LOAD =====================
function loadCSV(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const text = e.target.result;
      const objects = csvToObjects(text);
      if (!objects.length) { toast('❌ データが見つかりません（列名を確認してください）'); return; }
      importBuf = objects.map(rowToSeminar);
      document.getElementById('impInfo').textContent = `✅ ${importBuf.length}件の研修会を読み込みました`;
      document.getElementById('impRes').style.display = 'block';
      toast(`📋 ${importBuf.length}件を読み込みました`);
    } catch(err) {
      console.error(err);
      toast('❌ CSV読み込みエラー: ' + err.message);
    }
  };
  reader.onerror = () => {
    // UTF-8失敗時はShift-JISで再試行
    const r2 = new FileReader();
    r2.onload = e2 => {
      try {
        const objects = csvToObjects(e2.target.result);
        importBuf = objects.map(rowToSeminar);
        document.getElementById('impInfo').textContent = `✅ ${importBuf.length}件（Shift-JIS）`;
        document.getElementById('impRes').style.display = 'block';
      } catch(e) { toast('❌ 読み込み失敗'); }
    };
    r2.readAsText(file, 'Shift-JIS');
  };
  reader.readAsText(file, 'UTF-8');
}

// ===================== EXPORT =====================
function exportCSV() {
  const headers = ['No','開催日','曜日','開始','終了','テーマ','講師','対象','会場','進捗%','起案1','HP','起案2','起案3','ステータス'];
  const data = seminars.map(s => [
    s.no, s.date, s.day, s.start, s.end, s.title, s.speaker, s.subject, s.site,
    getProgress(s), s.kian1, s.hp, s.kian2, s.kian3,
    getStatus(s)==='done'?'完了':getStatus(s)==='wip'?'進行中':'未着手'
  ]);
  const csv = '\uFEFF' + [headers, ...data].map(r =>
    r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')
  ).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `研修会管理_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('📥 CSVをダウンロードしました');
}

    document.getElementById('vimport').style.display = id==='import' ? '' : 'none';
    if (id === 'gantt') renderGantt();
  });
});

// ===================== SORT =====================
document.querySelectorAll('.dt th[data-s]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.s;
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('.dt th[data-s]').forEach(t => {
      t.classList.remove('srt');
      t.querySelector('.si').textContent = '↕';
    });
    th.classList.add('srt');
    th.querySelector('.si').textContent = sortDir === 1 ? '↑' : '↓';
    renderTable();
  });
});

// ===================== FILTERS =====================
['srch','fsubj','fstat','fmon'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderTable);
  document.getElementById(id).addEventListener('change', renderTable);
});
['gfy','gfs'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderGantt);
});

// ===================== PANEL CLOSE =====================
document.getElementById('cpanel').addEventListener('click', () => document.getElementById('ov').classList.remove('open'));
document.getElementById('ov').addEventListener('click', e => { if (e.target === document.getElementById('ov')) document.getElementById('ov').classList.remove('open'); });

// ===================== FILE UPLOAD =====================
const ua = document.getElementById('ua');
const fi2 = document.getElementById('fi2');
ua.addEventListener('click', () => fi2.click());
fi2.addEventListener('change', e => loadCSV(e.target.files[0]));
ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('drag'); });
ua.addEventListener('dragleave', () => ua.classList.remove('drag'));
ua.addEventListener('drop', e => { e.preventDefault(); ua.classList.remove('drag'); loadCSV(e.dataTransfer.files[0]); });
document.getElementById('applyBtn').addEventListener('click', () => {
  if (importBuf) {
    seminars = importBuf;
    buildMonthFilter();
    renderStats();
    renderTable();
    toast(`✅ ${seminars.length}件を適用しました`);
    document.querySelector('[data-tab="list"]').click();
  }
});

// ===================== EXPORT BTN =====================
document.getElementById('exportBtn').addEventListener('click', exportCSV);

// ===================== INIT — 空の状態で起動、CSVインポートを促す =====================
function init() {
  // データなしで起動 → インポートタブを案内
  renderStats();
  buildMonthFilter();
  renderTable();
  // インポートタブにガイドメッセージ
  document.getElementById('tbody').innerHTML = `
    <tr><td colspan="11" style="padding:2rem;text-align:center;color:var(--muted)">
      「📂 CSVインポート」タブからAppSheetのCSVファイルを読み込んでください
    </td></tr>`;
}
init();
</script>
</body>
</html>
